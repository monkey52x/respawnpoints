modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''
logoFile = "assets/respawnpoints/icon.png"
[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "xaerominimap"
type = "required"
versionRange = "[${xaero_version},)"
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "xaeroworldmap"
type = "required"
versionRange = "[${xaero_worldmap_version},)"
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "journeymap"
type = "incompatible"
# JourneyMap is not supported: any installed version blocks loading with a clear error.
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
type = "optional"
versionRange = "[${yacl_version_neoforge},)"
ordering = "NONE"
side = "CLIENT"
