plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Optional: present at runtime only if the player installs the map mod.
    modCompileOnly "xaero.minimap:xaerominimap-fabric-${xaero_mc_version}:${xaero_version}"
    modCompileOnly "xaero.map:xaeroworldmap-fabric-${xaero_mc_version}:${xaero_worldmap_version}"
    modCompileOnly "xaero.lib:xaerolib-fabric-${xaero_mc_version}:${xaero_lib_version}"
    modCompileOnly "info.journeymap:journeymap-api-fabric:${journeymap_api_version}"
    // Optional: config screen (YACL) and ModMenu button, present only if installed.
    modCompileOnly "dev.isxander:yet-another-config-lib:${yacl_version_fabric}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-${version}+mc${minecraft_version}-${project.name}.jar"
}