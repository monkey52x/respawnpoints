name: Publish to Modrinth / CurseForge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        type: string
        required: true
      modrinth:
        description: Publish to Modrinth
        type: boolean
        default: true
      curseforge:
        description: Publish to CurseForge
        type: boolean
        default: true
      version_type:
        description: Release channel (auto = from tag name)
        type: choice
        options: [auto, release, beta, alpha]
        default: auto
      only:
        description: Publish only jars matching pattern (e.g. *mc1.21.1*)
        type: string
        default: '*'
      dry_run:
        description: Show what would be published without uploading
        type: boolean
        default: false

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  publish:
    name: Publish ${{ matrix.entry.file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        entry: ${{ fromJSON('[{"file": "respawnpoints-fabric-${{ inputs.tag }}.jar", "extra": "--modrinth"}, {"file": "respawnpoints-neoforge-${{ inputs.tag }}.jar", "extra": "--modrinth"}]') }}
    env:
      FILE: ${{ matrix.entry.file }}
      EXTRA: ${{ matrix.entry.extra }}
    steps:
      - uses: actions/checkout@v4

      - name: Download JARs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "respawnpoints-*.jar" --output dist

      - name: Publish to Modrinth
        if: ${{ inputs.modrinth }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          files: dist/*.jar
          version-type: release
          fail-mode: fail

      - name: Publish to CurseForge
        if: ${{ inputs.curseforge }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/*.jar
          version-type: release
          fail-mode: fail