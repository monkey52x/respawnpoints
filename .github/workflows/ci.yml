name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.loader }} - MC ${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            mc: "1.21.1"
            task: ":fabric:build"
          - loader: neoforge
            mc: "1.21.1"
            task: ":neoforge:build"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: false
      - name: Build
        run: ./gradlew ${{ matrix.task }} --no-daemon
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.loader }}-mc${{ matrix.mc }}
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          retention-days: 7