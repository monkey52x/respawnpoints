name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach jars to
        type: string
        required: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: false
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew :fabric:build :neoforge:build --no-daemon
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: jars-all
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          retention-days: 7

  release:
    name: Create release & upload jars
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download built JARs
        uses: actions/download-artifact@v4
        with:
          name: jars-all
          path: build/libs
      - name: Create or update release and upload JARs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Filter only main JARs
          JARS=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev.jar" | tr '\n' ' ')
          if [ -z "$JARS" ]; then
            echo "No JAR files found!"
            exit 1
          fi
          echo "Found JARs: $JARS"
          # Check if release exists
          if gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists, uploading assets..."
            gh release upload "${{ github.ref_name }}" build/libs/*.jar --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release..."
            gh release create "${{ github.ref_name }}" build/libs/*.jar --repo "$GITHUB_REPOSITORY" --generate-notes
          fi